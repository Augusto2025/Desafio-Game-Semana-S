{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cofre Digital - Segurança Máxima</title>
    <link rel="stylesheet" href="{% static 'style/Cofre.css' %}">
    
</head>
<body>

    <div class="painel-principal">
        <div class="parafuso p1"></div><div class="parafuso p2"></div>
        <div class="parafuso p3"></div><div class="parafuso p4"></div>

        <div class="interface-digital">
            <div class="visor-lcd">
                <div id="tentativas-cont" style="color: #ff3333; font-size: 1.1rem; margin-bottom: 5px;">
                    Tentativas restantes: <span id="num-tentativas">5</span>
                </div>
                
                <div class="inputs-container">
                    <div class="coluna-input">
                        <span class="seta-dica" id="dica-0"></span>
                        <input type="text" class="digito-input" maxlength="1" inputmode="numeric">
                    </div>
                    <div class="coluna-input">
                        <span class="seta-dica" id="dica-1"></span>
                        <input type="text" class="digito-input" maxlength="1" inputmode="numeric">
                    </div>
                    <div class="coluna-input">
                        <span class="seta-dica" id="dica-2"></span>
                        <input type="text" class="digito-input" maxlength="1" inputmode="numeric">
                    </div>
                    <div class="coluna-input">
                        <span class="seta-dica" id="dica-3"></span>
                        <input type="text" class="digito-input" maxlength="1" inputmode="numeric">
                    </div>
                    <div class="coluna-input">
                        <span class="seta-dica" id="dica-4"></span>
                        <input type="text" class="digito-input" maxlength="1" inputmode="numeric">
                    </div>
                </div>
                <div id="msg" class="status-msg">Insira o Código</div>
            </div>
            
            <div style="display: flex; gap: 20px; margin-top: 30px;">
                <button id="btn-enviar" onclick="verificar()" class="btn-abrir">Enviar Código</button>
                <button id="btn-enviar" onclick="window.location.href='{% url 'creditos' %}'" class="btn-sair">Finalizar sem o Segredo</button>
            </div>
        </div>

        <div class="engrenagem-container">
            <div id="volante" class="volante">
                <div class="volante-centro"></div>
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.digito-input');
        const volante = document.getElementById('volante');
        const msg = document.getElementById('msg');
        const spanTentativas = document.getElementById('num-tentativas');
        const btnEnviar = document.getElementById('btn-enviar');

        let tentativasRestantes = 5;
        let podeSair = false; 

        // --- FUNÇÃO DE PUNIÇÃO (AUTODESTRUIÇÃO) ---
        function travarSistema(motivo) {
            if (podeSair) return;
            podeSair = true;
            
            // Esconde tudo e bloqueia
            document.body.style.display = "none"; 
            
            // O replace impede que ele consiga "voltar" para o cofre depois
            window.location.replace("{% url 'ranking' %}");
            
            alert("⚠️ VIOLAÇÃO DE SEGURANÇA: " + motivo + "\nSessão encerrada.");
        }

        // --- BLOQUEIOS DE TECLADO E NAVEGAÇÃO ---
        // 1. Bloqueia o botão 'Voltar' do navegador (físico ou do mouse)
        // Criamos um loop no histórico. Se ele tentar voltar, ele cai no mesmo lugar e dispara o erro.
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.pushState(null, null, location.href);
            travarSistema("Botão voltar detectado!");
        };

        // 2. O evento que detecta quando a página está sendo descarregada (Refresh/Fechar aba)
        window.onbeforeunload = function (e) {
            if (!podeSair) {
                // A maioria dos navegadores modernos mostrará uma caixa de diálogo padrão
                // Se o usuário insistir em recarregar, a sessão do servidor deve tratar o reset
                const mensagem = "Se sair, o cofre será bloqueado!";
                e.returnValue = mensagem;
                return mensagem;
            }
        };

        // 3. Bloqueia atalhos de teclado (F5, Ctrl+R, etc)
        window.addEventListener('keydown', function (e) {
            if (
                e.key === 'F5' || 
                (e.ctrlKey && (e.key === 'r' || e.key === 'R')) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))
            ) {
                e.preventDefault();
                travarSistema("Atalho de recarregar/inspecionar!");
            }
        });

        // 4. Bloqueia o botão direito
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            travarSistema("Menu de contexto bloqueado!");
        });

        // --- LÓGICA ORIGINAL DO COFRE ---

        inputs[0].focus();

        inputs.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
            });
        });

        async function verificar() {
            if (tentativasRestantes <= 0) return;

            const tentativa = Array.from(inputs).map(i => i.value).join('');
            if(tentativa.length < 5) return;

            const res = await fetch("{% url 'desbloquear_cofre' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ tentativa })
            });

            const data = await res.json();

            if (data.status === 'sucesso') {
                podeSair = true; 
                msg.innerText = "ACESSO CONCEDIDO";
                msg.className = "status-msg sucesso-txt";
                volante.classList.add('girar'); 
                inputs.forEach(i => i.disabled = true);
                setTimeout(() => { window.location.href = "{% url 'premio' %}"; }, 3000);
            } else {
                tentativasRestantes--;
                spanTentativas.innerText = tentativasRestantes;

                if (data.dicas) {
                    data.dicas.forEach((dica, index) => {
                        const el = document.getElementById(`dica-${index}`);
                        if (dica === "up") { el.innerText = "▲"; el.className = "seta-dica seta-up"; }
                        else if (dica === "down") { el.innerText = "▼"; el.className = "seta-dica seta-down"; }
                        else { el.innerText = "✔"; el.className = "seta-dica seta-ok"; }
                    });
                }

                if (tentativasRestantes <= 0) {
                    podeSair = true;
                    window.location.replace("{% url 'ranking' %}");
                }
            }
        }
    </script>
</body>
</html>
