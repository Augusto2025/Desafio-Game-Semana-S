{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Desafio Portugol</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <style>
      .minha-posicao {
        background-color: #e1f5fe;
        font-weight: bold;
        border-left: 5px solid #0984e3;
      }
    </style>
  </head>
  <body>
    <!-- 🔥 ANIMAÇÃO -->
    <div class="animacao-fundo" data-img="{% static '../static/img/SimboloS.png' %}"></div>





    <div class="container">
        <section class="tela ativa">
            <h1>🏆 Ranking Top 10</h1>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Nome</th>
                        <th>Acertos</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody id="corpo-ranking">
                    </tbody>
            </table>
            <button class="btn btn-blue" style="margin-top: 30px;" onclick="window.location.href='{% url 'cadastro' %}'">Novo Jogo</button>
            <button class="btn btn-blue" style="margin-top: 30px;" onclick="window.location.href='{% url 'desbloquear_cofre' %}'">Desbloquear Cofre</button>
        </section>
    </div>

    <script>
      const usuarioAtual = localStorage.getItem("usuarioAtual");

      async function atualizarRanking() {
        const response = await fetch("{% url 'api_ranking' %}");
        const dados = await response.json();
        const corpo = document.getElementById("corpo-ranking");

        corpo.innerHTML = dados
          .map(
            (item, i) => `
                <tr class="${item.nome === usuarioAtual ? "minha-posicao" : ""}">
                    <td>${i + 1}º</td>
                    <td>${item.nome} ${item.nome === usuarioAtual ? "(Você)" : ""}</td>
                    <td>${item.acertos}</td>
                    <td>${item.tempo_texto}</td>
                </tr>
            `,
          )
          .join("");
      }

      atualizarRanking();
      // Atualização em tempo real a cada 3 segundos
      setInterval(atualizarRanking, 3000);
    </script>

    <script src="{% static 'scripts/animacaoCad.js' %}"></script>
  </body>
</html>
