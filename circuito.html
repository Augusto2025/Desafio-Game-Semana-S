<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Ranking - Desafios de Programação</title>
    <link rel="stylesheet" href="circuito.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Code Ranking</h1>
            <p>Resolva os desafios no menor tempo possível!</p>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <section class="desafio-section">
                    <h2>Desafio Atual</h2>
                    <div id="desafio" class="desafio-card">
                        <h3 id="desafio-titulo"></h3>
                        <p id="desafio-descricao"></p>
                        <p id="desafio-teste" class="teste-info"></p>
                    </div>
                </section>

                <section class="code-section">
                    <h2>Sua Solução</h2>
                    <textarea id="code" placeholder="Escreva seu código aqui..." rows="10"></textarea>
                    <div class="timer-display" id="timer">00:00.000</div>
                    <div class="button-group">
                        <button id="startBtn" class="btn primary">Iniciar Desafio</button>
                        <button id="submitBtn" class="btn success" disabled>Enviar Solução</button>
                    </div>
                </section>
            </div>

            <div class="right-panel">
                <section class="ranking-section">
                    <h2>Ranking</h2>
                    <div class="ranking-header">
                        <span>Pos</span>
                        <span>Nome</span>
                        <span>Tempo</span>
                    </div>
                    <div id="ranking-list" class="ranking-list"></div>
                </section>

                <section class="cadastro-section">
                    <h2>Cadastro</h2>
                    <input type="text" id="nome" placeholder="Seu nome" maxlength="50">
                    <button id="cadastrarBtn" class="btn secondary">Cadastrar</button>
                </section>
            </div>
        </div>
    </div>

    <script src="circuito.js"></script>
</body>
</html>
