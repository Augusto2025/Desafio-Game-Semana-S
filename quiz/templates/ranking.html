{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Desafio Portugol</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <style>
      /* Aumentando o título da página */
      h1 { font-size: 2.5rem !important; margin-bottom: 20px; }

      .ranking-wrapper {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .card-ranking {
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        min-height: 600px; /* Card mais alto */
      }

      .card-ranking h2 {
        text-align: center;
        margin-top: 0;
        font-size: 1.8rem; /* Letras maiores */
        padding-bottom: 15px;
        border-bottom: 3px solid #f8f9fa;
      }

      .facil-h2 { color: #27ae60; }
      .medio-h2 { color: #f39c12; }
      .dificil-h2 { color: #e74c3c; }

      /* --- PÓDIO AMPLIADO --- */
      .podium-mini {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 10px;
        margin: 25px 0;
        height: 160px; /* Pódio mais alto */
      }

      .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      .step-base {
        width: 100%;
        color: white;
        font-weight: bold;
        font-size: 1rem; /* Números maiores */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 8px 8px 0 0;
        box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
      }

      .step-name {
        font-size: 0.9rem; /* Nome maior */
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
        max-width: 110px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #2c3e50;
      }

      .first { height: 100px; background: #f1c40f; order: 2; border: 2px solid #d4ac0d; }
      .second { height: 70px; background: #bdc3c7; order: 1; border: 2px solid #a6acaf; }
      .third { height: 50px; background: #cd7f32; order: 3; border: 2px solid #a0522d; }

      .step-base span:first-child { font-size: 1.5rem; } /* Emoji maior */

      /* --- TABELA E CABEÇALHOS --- */
      .ranking-table {
        width: 100%;
        font-size: 1rem; /* Texto da tabela maior */
        border-collapse: collapse;
        margin-top: 10px;
      }

      .ranking-table thead th {
        color: #7f8c8d;
        font-size: 0.85rem;
        text-transform: uppercase;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }

      .ranking-table td {
        padding: 12px 5px;
        border-bottom: 1px solid #f1f1f1;
        color: #34495e;
      }

      .minha-posicao {
        background-color: #e1f5fe !important;
        font-weight: bold;
        border-left: 5px solid #0984e3;
      }

      .btn-group {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 40px;
      }

      .btn-group .btn {
        padding: 15px 30px;
        font-size: 1.1rem;
      }

      @media (max-width: 1100px) {
        .ranking-wrapper { grid-template-columns: 1fr; align-items: center; }
        .card-ranking { max-width: 500px; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="animacao-fundo" data-img="{% static '../static/img/SimboloS.png' %}"></div>

    <div class="container" style="max-width: 1500px;">
        <section class="tela ativa">
            <h1>🏆 Rankings Globais</h1>

            <div class="ranking-wrapper">
                <div class="card-ranking">
                    <h2 class="facil-h2">🟢 Fácil</h2>
                    <div id="podium-facil" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-facil"></tbody>
                    </table>
                </div>

                <div class="card-ranking">
                    <h2 class="medio-h2">🟡 Médio</h2>
                    <div id="podium-medio" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-medio"></tbody>
                    </table>
                </div>

                <div class="card-ranking">
                    <h2 class="dificil-h2">🔴 Difícil</h2>
                    <div id="podium-dificil" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-dificil"></tbody>
                    </table>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-blue" onclick="window.location.href='{% url 'cadastro' %}'">Novo Jogo</button>
                <button class="btn btn-blue" onclick="window.location.href='{% url 'desbloquear_cofre' %}'">Ir ao Cofre</button>
            </div>
        </section>
    </div>

    <script>
      const usuarioAtual = localStorage.getItem("usuarioAtual");

      async function atualizarRanking() {
        try {
            const response = await fetch("{% url 'api_ranking' %}");
            const dados = await response.json();

            processarRanking("facil", dados.facil);
            processarRanking("medio", dados.medio);
            processarRanking("dificil", dados.dificil);
        } catch (e) { console.error(e); }
      }

      function processarRanking(nivel, lista) {
        const podiumDiv = document.getElementById(`podium-${nivel}`);
        const corpoTabela = document.getElementById(`ranking-${nivel}`);
        
        if (!lista || lista.length === 0) {
            podiumDiv.innerHTML = "<p style='color:#999; margin-top:50px;'>Aguardando campeões...</p>";
            corpoTabela.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Nenhum dado</td></tr>';
            return;
        }

        // Renderizar Pódio (Top 3)
        const top3 = lista.slice(0, 3);
        const medals = ["🥇", "🥈", "🥉"];
        const classes = ["first", "second", "third"];
        let podiumHTML = "";

        // Ordem visual: 2º, 1º, 3º
        [1, 0, 2].forEach(i => {
            const p = top3[i];
            if (p) {
                podiumHTML += `
                    <div class="podium-step">
                        <div class="step-name" title="${p.nome}">${p.nome === usuarioAtual ? "⭐ Você" : p.nome}</div>
                        <div class="step-base ${classes[i]}">
                            <span>${medals[i]}</span>
                            <span>${p.acertos}/5</span>
                        </div>
                    </div>`;
            } else {
                // Espaço vazio caso não tenha 3 jogadores ainda
                podiumHTML += `<div class="podium-step"><div style="height:30px"></div><div class="step-base" style="background:#eee; height:30px; order:${i===0?2:(i===1?1:3)}"></div></div>`;
            }
        });
        podiumDiv.innerHTML = podiumHTML;

        // Renderizar Tabela (do 4º em diante)
        const restante = lista.slice(3);
        corpoTabela.innerHTML = restante.map((item, i) => `
            <tr class="${item.nome === usuarioAtual ? "minha-posicao" : ""}">
                <td style="font-weight:bold">${i + 4}º</td>
                <td>${item.nome}</td>
                <td>${item.acertos}/5</td>
                <td style="color:#7f8c8d; font-size:0.85rem">${item.tempo_texto}</td>
            </tr>
        `).join("");
      }

      atualizarRanking();
      setInterval(atualizarRanking, 5000); // Atualiza a cada 5 segundos para poupar o servidor
    </script>
    <script src="{% static 'scripts/animacaoCad.js' %}"></script>
  </body>
</html>
