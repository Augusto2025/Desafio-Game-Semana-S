{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Desafio Portugol</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <style>
      /* Destaque para o usuário logado na tabela */
      .minha-posicao {
        background-color: #e1f5fe !important;
        font-weight: bold;
        border-left: 5px solid #0984e3;
      }

      /* --- ESTILOS DO PÓDIO --- */
      .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 10px;
        margin: 40px 0 30px 0;
        height: 200px;
      }

      .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100px;
        text-align: center;
      }

      .step-base {
        width: 100%;
        border-radius: 10px 10px 0 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: height 0.5s ease-out;
      }

      .podium-name {
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100px;
      }

      /* Medalhas e Badges */
      .medal { font-size: 1.8rem; margin-bottom: 2px; }
      .podium-score { font-size: 0.7rem; opacity: 0.9; }

      /* Configuração Individual dos Degraus */
      .first { 
        height: 150px; 
        background: linear-gradient(135deg, #f1c40f, #f39c12); 
        order: 2; /* Centro */
        z-index: 2;
      }
      .second { 
        height: 110px; 
        background: linear-gradient(135deg, #bdc3c7, #95a5a6); 
        order: 1; /* Esquerda */
      }
      .third { 
        height: 80px; 
        background: linear-gradient(135deg, #cd7f32, #a0522d); 
        order: 3; /* Direita */
      }

      .ranking-table {
        width: 100%;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="animacao-fundo" data-img="{% static 'img/SimboloS.png' %}"></div>

    <div class="container">
        <section class="tela ativa">
            <h1>🏆 Ranking Top 10</h1>

            <div id="podium" class="podium-container">
                </div>

            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Nome</th>
                        <th>Acertos</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody id="corpo-ranking">
                    </tbody>
            </table>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-blue" style="margin-top: 30px;" onclick="window.location.href='{% url 'cadastro' %}'">Voltar para o cadastro</button>
                <button class="btn btn-blue" style="margin-top: 30px;" onclick="window.location.href='{% url 'desbloquear_cofre' %}'">Desbloquear Cofre</button>
            </div>
        </section>
    </div>

    <script>
      const usuarioAtual = localStorage.getItem("usuarioAtual");

      async function atualizarRanking() {
        try {
            const response = await fetch("{% url 'api_ranking' %}");
            const dados = await response.json();
            
            const podium = document.getElementById("podium");
            const corpo = document.getElementById("corpo-ranking");

            // --- LÓGICA DO PÓDIO (TOP 3) ---
            const top3 = dados.slice(0, 3);
            const medalhas = ["🥇", "🥈", "🥉"];
            const classes = ["first", "second", "third"];
            
            let podiumHTML = "";
            
            // Ordem [1, 0, 2] garante que o 2º fique na esquerda, 1º no centro e 3º na direita
            [1, 0, 2].forEach(i => {
                const player = top3[i];
                if (player) {
                    podiumHTML += `
                        <div class="podium-step">
                            <div class="podium-name">${player.nome === usuarioAtual ? "⭐ Você" : player.nome}</div>
                            <div class="step-base ${classes[i]}">
                                <span class="medal">${medalhas[i]}</span>
                                <span>${i + 1}º</span>
                                <span class="podium-score">${player.acertos} pts</span>
                            </div>
                        </div>
                    `;
                }
            });
            podium.innerHTML = podiumHTML;

            // --- LÓGICA DA TABELA (4º EM DIANTE) ---
            const restante = dados.slice(3);
            corpo.innerHTML = restante
              .map(
                (item, i) => `
                    <tr class="${item.nome === usuarioAtual ? "minha-posicao" : ""}">
                        <td>${i + 4}º</td>
                        <td>${item.nome} ${item.nome === usuarioAtual ? "(Você)" : ""}</td>
                        <td>${item.acertos}</td>
                        <td>${item.tempo_texto}</td>
                    </tr>
                `,
              )
              .join("");
        } catch (e) {
            console.error("Erro ao atualizar ranking", e);
        }
      }

      atualizarRanking();
      setInterval(atualizarRanking, 3000);
    </script>

    <script src="{% static 'scripts/animacaoCad.js' %}"></script>
  </body>
</html>
