<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Desafio Portugol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section class="tela ativa">
            <h1>👋 Bem-vindo!</h1>
            <p>Insira seu nome para o ranking:</p>
            <input type="text" id="input-nome" placeholder="Digite seu nome aqui...">
            <br>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-blue" onclick="irParaJogo()">Continuar</button>
                <button class="btn btn-alt" style="text-align: center;" onclick="window.location.href='ranking.html'">Ver Ranking</button>
            </div>
        </section>
    </div>

    <script>
        function irParaJogo() {
            const nome = document.getElementById('input-nome').value.trim();
            if (!nome) return alert("Por favor, digite seu nome!");
            localStorage.setItem('usuarioAtual', nome);
            window.location.href = 'desafio.html';
        }
    </script>
</body>
</html>
