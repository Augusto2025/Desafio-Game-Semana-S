{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - Desafio Portugol</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <link rel="stylesheet" href="{% static 'style/Ranking.css' %}">
    <style>
      /* Estilo de destaque para o jogador atual no pódio */
      .meu-podio .step-name {
          color: #ffcc00 !important; /* Amarelo ouro */
          font-weight: 900 !important;
          text-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
          transform: scale(1.1);
      }
      
      .meu-podio .step-base {
          border: 3px solid #ffcc00 !important;
          box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
          animation: pulse-gold 2s infinite;
      }

      @keyframes pulse-gold {
          0% { box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
          50% { box-shadow: 0 0 25px rgba(255, 204, 0, 0.7); }
          100% { box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
      }
    </style>
  </head>
  <body>
    <div class="animacao-fundo" data-img="{% static '../static/img/SimboloS.png' %}"></div>

    <div class="container" style="max-width: 1500px;">
        <section class="tela ativa">
            <h1>🏆 Rankings Globais</h1>

            <div class="ranking-wrapper">
                <div class="card-ranking">
                    <h2 class="facil-h2">🟢 Fácil</h2>
                    <div id="podium-facil" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-facil"></tbody>
                    </table>
                </div>

                <div class="card-ranking">
                    <h2 class="medio-h2">🟡 Médio</h2>
                    <div id="podium-medio" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-medio"></tbody>
                    </table>
                </div>

                <div class="card-ranking">
                    <h2 class="dificil-h2">🔴 Difícil</h2>
                    <div id="podium-dificil" class="podium-mini"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Nome</th>
                                <th>Pts</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-dificil"></tbody>
                    </table>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-blue" onclick="window.location.href='{% url 'cadastro' %}'">Novo Jogo</button>
            </div>
        </section>
    </div>

    <script>
      const usuarioAtual = localStorage.getItem("usuarioAtual");

      async function atualizarRanking() {
        try {
            const response = await fetch("{% url 'api_ranking' %}");
            const dados = await response.json();

            processarRanking("facil", dados.facil);
            processarRanking("medio", dados.medio);
            processarRanking("dificil", dados.dificil);
        } catch (e) { console.error(e); }
      }

      function processarRanking(nivel, lista) {
        const podiumDiv = document.getElementById(`podium-${nivel}`);
        const corpoTabela = document.getElementById(`ranking-${nivel}`);
        
        if (!lista || lista.length === 0) {
            podiumDiv.innerHTML = "<p style='color:#999; margin-top:50px;'>Aguardando campeões...</p>";
            corpoTabela.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Nenhum dado</td></tr>';
            return;
        }

        // Renderizar Pódio (Top 3)
        const top3 = lista.slice(0, 3);
        const medals = ["🥇", "🥈", "🥉"];
        const classes = ["first", "second", "third"];
        let podiumHTML = "";

        // Ordem visual: 2º, 1º, 3º
        [1, 0, 2].forEach(i => {
            const p = top3[i];
            if (p) {
                // Verifica se é o jogador atual
                const ehEu = p.nome === usuarioAtual;
                
                podiumHTML += `
                    <div class="podium-step ${ehEu ? 'meu-podio' : ''}">
                        <div class="step-name" title="${p.nome}">${ehEu ? "⭐ Você" : p.nome}</div>
                        <div class="step-base ${classes[i]}">
                            <span>${medals[i]}</span>
                            <span>${p.acertos}/5</span>
                        </div>
                    </div>`;
            } else {
                podiumHTML += `<div class="podium-step"><div style="height:30px"></div><div class="step-base" style="background:#eee; height:30px; order:${i===0?2:(i===1?1:3)}"></div></div>`;
            }
        });
        podiumDiv.innerHTML = podiumHTML;

        // Renderizar Tabela (do 4º em diante)
        const restante = lista.slice(3);
        corpoTabela.innerHTML = restante.map((item, i) => `
            <tr class="${item.nome === usuarioAtual ? "minha-posicao" : ""}">
                <td style="font-weight:bold">${i + 4}º</td>
                <td>${item.nome}</td>
                <td>${item.acertos}/5</td>
                <td style="color:#7f8c8d; font-size:0.85rem">${item.tempo_texto}</td>
            </tr>
        `).join("");
      }

      atualizarRanking();
      setInterval(atualizarRanking, 5000); 
    </script>
    <script src="{% static 'scripts/animacaoCad.js' %}"></script>
  </body>
</html>
