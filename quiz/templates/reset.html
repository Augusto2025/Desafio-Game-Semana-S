<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetar Ranking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-reset {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .btn-reset-trigger {
            padding: 12px 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-reset-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
    </style>
</head>
<body>

    <div class="container-reset">
        <h2 class="mb-4 text-dark">Área Administrativa</h2>
        <p class="text-muted mb-4">Clique no botão abaixo para limpar todos os dados do Ranking.</p>
        
        <button type="button" class="btn btn-danger btn-reset-trigger" data-bs-toggle="modal" data-bs-target="#confirmModal">
            Resetar Banco de Dados
        </button>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Você tem certeza?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-start">
                    Esta ação irá deletar <strong>permanentemente</strong> todos os registros da tabela de Ranking. 
                    Essa operação não pode ser desfeita.
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <!-- O Botão que realmente dispara o JS -->
                    <button type="button" id="confirmarResetBtn" class="btn btn-danger px-4">Sim, Resetar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('confirmarResetBtn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerText;
            
            // Desabilita o botão para evitar cliques múltiplos
            btn.disabled = true;
            btn.innerText = 'Processando...';

            // Faz a chamada para a view reset_ranking
            fetch("{% url 'reset_ranking' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "X-Requested-With": "XMLHttpRequest"
                }
            })
            .then(response => {
                if (!response.ok) throw new Error('Erro na requisição');
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    alert('Sucesso: ' + data.message);
                    
                    // Fecha o modal via Bootstrap
                    const modalElement = document.getElementById('confirmModal');
                    const modal = bootstrap.Modal.getInstance(modalElement);
                    modal.hide();
                } else {
                    alert('Erro ao resetar: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert('Erro de conexão com o servidor.');
            })
            .finally(() => {
                // Restaura o botão
                btn.disabled = false;
                btn.innerText = originalText;
            });
        });
    </script>

</body>
</html>
